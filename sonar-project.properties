# SonarQube / SonarCloud configuration for proselign.
# CI (.github/workflows/sonarcloud.yml) and `make sonarqube-scan` both use it.

sonar.projectKey=bceverly_proselign
sonar.organization=bceverly
sonar.projectName=Proselign

sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12,3.13,3.14

# Coverage from `make test` (pytest-cov XML).
sonar.python.coverage.reportPaths=coverage.xml
# Developer tooling in scripts/ is linted and scanned but outside the coverage
# measure: it drives version control and make, and only its pure helpers are
# unit-tested.
sonar.coverage.exclusions=scripts/**

sonar.exclusions=**/__pycache__/**,**/.venv*/**,build/**,htmlcov/**,website/**,docs/**
sonar.cpd.exclusions=tests/**

sonar.links.homepage=https://proselign.org
sonar.links.ci=https://github.com/bceverly/proselign/actions
sonar.links.scm=https://github.com/bceverly/proselign
sonar.links.issue=https://github.com/bceverly/proselign/issues
