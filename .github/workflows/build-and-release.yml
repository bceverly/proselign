name: Build and Release

# Runs when `make release` pushes a vW.X.Y.Z tag (four-part, like sysmanage):
#   wait-for-ci -> every CI job (lint, tests on 3.10-3.14 incl. Lucky 13, .deb
#               builds on each LTS and s390x) passed on the tagged commit
#   verify   -> the tag matches __version__
#   build    -> Python sdist + wheel; .deb packages for amd64 and arm64 (native
#               runners) and ppc64el and s390x (QEMU-emulated; no free runners)
#   release  -> GitHub release with every artifact and SHA256SUMS
#   launchpad-> signed source uploads to ppa:bceverly/proselign, one per
#               supported Ubuntu LTS; Launchpad builds natively for amd64 and
#               arm64 (full LLM support) and ppc64el and s390x (CPU-only tier).
#
# Secrets: LAUNCHPAD_GPG_KEY, LAUNCHPAD_GPG_PASSPHRASE, LAUNCHPAD_SSH_KEY
# (see CONTRIBUTING.md).

on:
  push:
    tags: ['v*.*.*.*']
  workflow_dispatch:
    inputs:
      upload_to_launchpad:
        description: 'Upload source packages to the PPA'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEBFULLNAME: Bryan C. Everly
  DEBEMAIL: bryan@theeverlys.com

jobs:
  # Release only what CI has already passed.  ci.yml also runs on release
  # tags, so these checks exist on the tagged commit even when the tag is
  # pushed on its own.  The names must match ci.yml's job names.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      checks: read
    strategy:
      fail-fast: true
      matrix:
        check:
          - 'Lint'
          - 'Test (Python 3.10)'
          - 'Test (Python 3.11)'
          - 'Test (Python 3.12)'
          - 'Test (Python 3.13)'
          - 'Test (Python 3.14)'
          - 'Debian package (ubuntu:22.04)'
          - 'Debian package (ubuntu:24.04)'
          - 'Debian package (ubuntu:26.04)'
          - 'Debian package (s390x, emulated)'
    steps:
      - name: Wait for ${{ matrix.check }}
        uses: lewagon/wait-on-check-action@74049309dfeff245fe8009a0137eacf28136cb3c # v1.5.0
        with:
          ref: ${{ github.sha }}
          check-name: ${{ matrix.check }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

  verify:
    name: Verify release
    needs: wait-for-ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked dev dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Tag matches __version__
        run: python scripts/check_version.py
      - id: version
        run: echo "version=$(python -c 'import proselign; print(proselign.__version__)')" >> "$GITHUB_OUTPUT"

  build-python:
    name: Python sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.txt
          python -m build --no-isolation --outdir dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*

  build-deb:
    name: .deb (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Built on the oldest supported LTS so the package installs on all of them.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential debhelper \
            dh-python python3-all python3-pytest dpkg-dev lintian
      - name: Build
        run: packaging/ubuntu/build.sh binary "${{ needs.verify.outputs.version }}"
      - name: Lintian
        run: lintian --fail-on error build/deb/proselign_*.deb
      - name: Install and smoke test
        run: |
          apt-get install -y -qq ./build/deb/proselign_*_${{ matrix.arch }}.deb
          proselign --version | grep -F "${{ needs.verify.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: build/deb/proselign_*.deb

  build-deb-emulated:
    name: .deb (${{ matrix.arch }}, emulated)
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ppc64el
            platform: linux/ppc64le
          - arch: s390x       # big-endian: the package's tests run there too
            platform: linux/s390x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.platform }}
      - name: Build, lint and smoke test under emulation
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "${{ matrix.platform }}" -v "$PWD:/src" -w /src \
            -e VERSION -e ARCH -e DEBFULLNAME -e DEBEMAIL ubuntu:22.04 sh -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends build-essential debhelper \
                dh-python python3-all python3-pytest dpkg-dev lintian >/dev/null
              packaging/ubuntu/build.sh binary "$VERSION"
              lintian --fail-on error build/deb/proselign_*_"$ARCH".deb
              apt-get install -y -qq ./build/deb/proselign_*_"$ARCH".deb >/dev/null
              proselign --version | grep -F "$VERSION"
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: build/deb/proselign_*.deb

  release:
    name: GitHub release
    needs: [verify, build-python, build-deb, build-deb-emulated]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat > ../release_notes.md <<EOF
          ## Proselign ${VERSION}

          ### Install on Ubuntu 22.04 / 24.04 / 26.04
          amd64 and arm64 (full support), ppc64el and s390x (CPU-only inference tier).
          \`\`\`sh
          sudo add-apt-repository ppa:bceverly/proselign
          sudo apt update && sudo apt install proselign
          \`\`\`
          Or download the \`.deb\` for your architecture below.

          ### Install with pip (Python 3.10+)
          \`\`\`sh
          pip install proselign-${VERSION}-py3-none-any.whl
          \`\`\`

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          body_path: release_notes.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  launchpad:
    name: PPA upload (${{ matrix.series }})
    needs: [verify, build-deb]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_launchpad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu LTS releases whose Python (>= 3.10) the LLM stack supports.
        # Architectures come from debian/control; enable the same four under
        # the PPA's Processors settings.
        series: [jammy, noble, resolute]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends devscripts debhelper dh-python \
            python3-all dput-ng gnupg openssh-client python3-paramiko
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_KEY }}
        run: |
          # Accept the key armored or base64-encoded.
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null \
            || echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
          gpg --list-secret-keys --keyid-format long
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          # Launchpad silently discards uploads signed by a key it does not
          # know (no email, no error), so check the key is registered first.
          if ! curl -fsS "https://api.launchpad.net/devel/~bceverly/gpg_keys" \
              | jq -e --arg f "$FPR" 'any(.entries[]; .fingerprint == $f)' >/dev/null; then
            echo "::error::Signing key $FPR is not registered on launchpad.net/~bceverly (OpenPGP keys); Launchpad would discard the upload."
            exit 1
          fi
          echo "Signing key $FPR is registered on Launchpad"
          echo "GPG_KEY_ID=$FPR" >> "$GITHUB_ENV"
      - name: SSH agent for SFTP upload
        env:
          SSH_KEY: ${{ secrets.LAUNCHPAD_SSH_KEY }}
        run: |
          # Launchpad's FTP endpoint silently drops uploads from GitHub
          # runners (LP #1836059); SFTP is reliable.  paramiko ignores
          # ~/.ssh/config, so the key goes into an agent.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ppa.launchpad.net >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          echo "$SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: dput profile
        run: |
          mkdir -p ~/.dput.d/profiles
          cat > ~/.dput.d/profiles/launchpad.json <<'EOF'
          {
            "fqdn": "ppa.launchpad.net",
            "incoming": "~bceverly/ubuntu/proselign/",
            "method": "sftp",
            "login": "bceverly",
            "allow_unsigned_uploads": false
          }
          EOF
      - name: Build, sign and upload source package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SERIES: ${{ matrix.series }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          packaging/ubuntu/build.sh source "$VERSION" "$SERIES"
          cd build/deb
          CHANGES="proselign_${VERSION}+ppa1~${SERIES}1_source.changes"
          PASSFILE=$(mktemp)
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"
          debsign --re-sign -k"$GPG_KEY_ID" \
            -p"gpg --batch --yes --pinentry-mode loopback --passphrase-file $PASSFILE" "$CHANGES"
          rm -f "$PASSFILE"
          for attempt in 1 2 3 4 5; do
            dput -f launchpad "$CHANGES" < /dev/null && exit 0
            echo "dput attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1
      - name: Wait for Launchpad to accept the upload
        # A finished dput only means the files reached the upload server;
        # Launchpad accepts or rejects them a few minutes later.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SERIES: ${{ matrix.series }}
        run: |
          WANT="${VERSION}+ppa1~${SERIES}1"
          URL="https://api.launchpad.net/devel/~bceverly/+archive/ubuntu/proselign?ws.op=getPublishedSources&source_name=proselign&exact_match=true"
          for _ in $(seq 1 40); do
            if curl -fsS "$URL" \
                | jq -e --arg v "$WANT" 'any(.entries[]; .source_package_version == $v)' >/dev/null; then
              echo "Launchpad accepted proselign $WANT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::proselign $WANT did not appear in the PPA within 20 minutes. Check email from Launchpad for a rejection; no email means the signature was not recognised."
          exit 1
