# Dependabot version updates.  Security alerts and security updates are
# switched on separately in the repository settings (see CONTRIBUTING.md).
version: 2
updates:
  # Hash-locked requirements-*.txt files (regenerated by `make lock`).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      python-tooling:
        patterns: ['*']

  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
